<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none">
  <!-- PALA TREKKING - Swiss Alpine Geometric Lockup -->
  <g transform="translate(18, 16)">
    <!-- Primary Summit (Everest / Lhotse Sharp Peak) -->
    <polygon points="24,6 44,44 4,44" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Internal Glacial Ridge Line -->
    <line x1="24" y1="6" x2="28" y2="44" stroke="#ffffff" stroke-width="1.8" opacity="0.6"/>
    <!-- Secondary Peak Behind with Accent Summit -->
    <polygon points="36,18 48,44 24,44" fill="#151b1f" stroke="#9fabad" stroke-width="1.8" stroke-linejoin="round"/>
    <!-- Red Alpenglow Summit Cap -->
    <polygon points="24,6 20,14 27,14" fill="#e4583e"/>
  </g>

  <!-- Typography -->
  <text x="82" y="37" font-family="'Archivo', system-ui, -apple-system, sans-serif" font-weight="900" font-size="25" letter-spacing="0.18em" fill="#ffffff">PALA</text>
  <text x="83" y="52" font-family="'Archivo', system-ui, -apple-system, sans-serif" font-weight="400" font-size="10.5" letter-spacing="0.42em" fill="#9fabad">TREKKING</text>
  <line x1="188" y1="48" x2="280" y2="48" stroke="#e4583e" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="286" cy="48" r="2" fill="#e4583e"/>
</svg>
